<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSA — SAPTHA</title>

<link rel="stylesheet" href="style.css">

<style>
.dsa-section{
    padding:40px 20px 60px;
    background:linear-gradient(to bottom,#f5f8ff,#ffffff);
    min-height:75vh;
}

.dsa-hero{
    text-align:center;
    margin-bottom:35px;
}

.dsa-hero h1{
    font-size:38px;
    color:#0b3d91;
    margin-bottom:8px;
}

.dsa-hero p{
    color:#555;
    font-size:18px;
}

.announcements-list{
    list-style:none;
    padding:0;
    margin-top:20px;
}

.announcements-list li{
    background:#fff;
    border-left:6px solid #0b3d91;
    border-radius:10px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 8px 20px rgba(0,0,0,0.06);
    transition:.3s ease;
    position:relative;
}

.announcements-list li:hover{
    transform:translateY(-3px);
}
</style>
</head>

<body>
<script src="script.js"></script>
<script>
const u = requireAuth();
renderHeader("dsa.html");
if (canEdit("dsa")) {
    document.body.insertAdjacentHTML("beforeend", `
        <button class="add-btn" id="openAddDsa" type="button" aria-label="Add DSA Activity or Announcement">+</button>
    `);
}
</script>

<section class="dsa-section">
<div class="container">

  <div class="dsa-hero">
      <h1>DSA & Activities</h1>
      <p>Updates, files and announcements for all campus activities and student affairs</p>
  </div>

  <ul class="announcements-list" id="al"></ul>

</div>
</section>

<dialog class="portal-dialog" id="addDsaDialog" aria-labelledby="addDsaTitle">
    <form class="portal-form" id="addDsaForm">
        <div class="portal-form-header">
            <h3 id="addDsaTitle">New Activity / Announcement</h3>
            <button class="portal-close-btn" id="closeAddDsa" type="button" aria-label="Close">&times;</button>
        </div>
        <label for="dsaTitle">Activity / Event Title
            <input id="dsaTitle" type="text" required placeholder="e.g. Hackathon Registration Open" maxlength="120">
        </label>
        <label for="dsaBy">Posted By / Organizer
            <input id="dsaBy" type="text" required placeholder="e.g. DSA Coordinator" maxlength="80">
        </label>
        <label for="dsaBody">Description / Details
            <textarea id="dsaBody" required placeholder="Provide full details, guidelines, rules or timeline..." rows="4"></textarea>
        </label>
        <label for="dsaFile">Attachment (Optional Flyer / PDF / Document)
            <input id="dsaFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.rtf,.png,.jpg,.jpeg">
        </label>
        <p class="portal-status" id="dsaStatus" role="status" aria-live="polite"></p>
        <div class="portal-form-actions">
            <button class="btn sm" id="cancelAddDsa" type="button" style="background:#eee;color:#333;">Cancel</button>
            <button class="btn sm" id="submitAddDsa" type="submit">Post Activity</button>
        </div>
    </form>
</dialog>

<script>
const COLLECTION = "activity_announcements";
let activityItems = [];

async function loadItems(){
  const raw = await apiList(COLLECTION);
  activityItems = raw.map(item => ({ id: item.id, ...(item.data || item) }));
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function delItem(id){
  if(!confirm("Delete this DSA activity post?")) return;
  try {
    await apiDelete(COLLECTION, id);
    await loadItems();
    render();
  } catch(err) {
    alert(err.message || "Failed to delete item.");
  }
}

function render(){
  const al = document.getElementById("al");
  al.innerHTML = "";

  if(activityItems.length === 0){
    al.innerHTML = `<li style="text-align:center;color:#666;border-left:none;">
      <h4>No DSA announcements or activities posted yet.</h4>
      ${canEdit("dsa") ? `<p style="margin-top:8px">Click the <b>+</b> button to post a new activity notice.</p>` : ""}
    </li>`;
    return;
  }

  const items = activityItems.slice().reverse();
  const editable = canEdit("dsa");

  items.forEach(a=>{
    const attachment = safeDataURL(a.file);
    const image = safeImageDataURL(attachment);
    al.insertAdjacentHTML("beforeend",`
      <li>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
          <div>
            <h4 style="margin:0 0 4px;font-size:18px;color:#0b3d91;">${escapeHTMLValue(a.title)}</h4>
            <small style="color:#777;">${escapeHTMLValue(a.date || "")} · ${escapeHTMLValue(a.by || "DSA Member")}</small>
          </div>
          ${editable ? `<button class="btn-card-del" onclick="delItem('${escapeHTMLValue(a.id)}')">Delete</button>` : ""}
        </div>
        <p style="margin:12px 0;white-space:pre-wrap;">${escapeHTMLValue(a.body)}</p>

        ${attachment ? `
          ${image
            ? `<img src="${escapeHTMLValue(image)}" style="max-width:320px;max-height:220px;display:block;margin:12px 0;border-radius:8px;object-fit:contain;border:1px solid #eee;">`
            : `<a href="${escapeHTMLValue(attachment)}" download class="btn sm" style="display:inline-block;margin-top:6px;">Download Attachment</a>`
          }
        ` : ``}
      </li>
    `);
  });
}

// Dialog bindings
const openAddDsa = document.getElementById("openAddDsa");
const addDsaDialog = document.getElementById("addDsaDialog");
const addDsaForm = document.getElementById("addDsaForm");
const dsaStatus = document.getElementById("dsaStatus");
const submitAddDsa = document.getElementById("submitAddDsa");

if (openAddDsa && addDsaDialog) {
  openAddDsa.addEventListener("click", () => {
    addDsaForm.reset();
    document.getElementById("dsaBy").value = u?.name || "DSA Member";
    dsaStatus.textContent = "";
    addDsaDialog.showModal();
  });

  document.getElementById("closeAddDsa").addEventListener("click", () => addDsaDialog.close());
  document.getElementById("cancelAddDsa").addEventListener("click", () => addDsaDialog.close());

  addDsaForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!canEdit("dsa")) return;

    const title = document.getElementById("dsaTitle").value.trim();
    const by = document.getElementById("dsaBy").value.trim();
    const body = document.getElementById("dsaBody").value.trim();
    const fileInput = document.getElementById("dsaFile");

    if (!title || !body) return;

    submitAddDsa.disabled = true;
    dsaStatus.textContent = "Posting activity notice...";

    try {
      let fileData = "";
      if (fileInput.files.length > 0) {
        fileData = await fileToBase64(fileInput.files[0]);
      }

      const dateStr = new Date().toLocaleDateString("en-US", {
        month: "short", day: "numeric", year: "numeric"
      });

      await apiCreate(COLLECTION, {
        title,
        by,
        body,
        file: fileData,
        date: dateStr
      });

      await loadItems();
      render();
      addDsaDialog.close();
    } catch (err) {
      dsaStatus.textContent = err.message || "Failed to post activity.";
    } finally {
      submitAddDsa.disabled = false;
    }
  });
}

loadItems().then(render).catch(err => alert(err.message));
renderFooter();
</script>

</body>
</html>
