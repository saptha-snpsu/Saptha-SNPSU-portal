<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Events — SAPTHA</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<script src="script.js"></script>
<script>
const u = requireAuth();
renderHeader("events.html");
</script>

<section>
<div class="container">

  <h3>Events</h3>
  <p class="lead">Fests, workshops & cultural nights.</p>

  <div id="eventForm"></div>
  <div class="grid cols-2" id="eventList"></div>

</div>
</section>

<script>
const COLLECTION = "events";
let events = [];

async function loadData(){
  const raw = await apiList(COLLECTION);
  events = raw.map(item => ({ id: item.id, ...item.data }));
}

async function delEvent(id){
  if(!confirm("Delete this event?")) return;
  await apiDelete(COLLECTION, id);
  await loadData();
  render();
}

function render(){
  const box = document.getElementById("eventList");
  box.innerHTML = "";

  const items = events.slice().reverse();

  items.forEach(e=>{
    box.insertAdjacentHTML("beforeend",`
      <div class="card">
        <span class="tag">${e.type}</span>
        <h4>${e.title}</h4>
        <small>${e.date}</small>
        <p style="margin-top:8px">${e.desc}</p>
      </div>
    `);
  });
}

loadData().then(render).catch(err => alert(err.message));
renderFooter();
</script>

    <!-- Vercel Web Analytics -->
    <script type="module" src="analytics.js"></script>

</body>
</html>
